<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Lost &amp; Found</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav>
  <a class="brand" href="{{ url_for('index') }}">📦 Campus Lost &amp; Found</a>
  <div>
    <a href="{{ url_for('report_lost') }}">Report Lost</a>
    <a href="{{ url_for('register_found') }}">Register Found</a>
    <a href="{{ url_for('search') }}">Search</a>
    {% if session.admin %}
      <a href="{{ url_for('admin') }}">Admin</a>
      <a href="{{ url_for('admin_logout') }}">Logout</a>
    {% else %}
      <a href="{{ url_for('admin_login') }}">Admin</a>
    {% endif %}
  </div>
</nav>
<main>
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
