{% extends "base.html" %}
{% block content %}
<h1>{{ "Register a Found Item" if kind == "found" else "Report a Lost Item" }}</h1>
<form method="post" enctype="multipart/form-data" class="form">
  <label>Item name <input name="name" required></label>
  <label>Category
    <select name="category">{% for c in categories %}<option>{{ c }}</option>{% endfor %}</select>
  </label>
  <label>Description <textarea name="description" rows="3" required></textarea></label>
  <label>{{ "Where was it found?" if kind == "found" else "Where did you lose it?" }}
    <input name="location" required></label>
  <label>Date <input type="date" name="date" required></label>
  <label>Your email / phone <input name="contact" required></label>
  <label>Photo (optional) <input type="file" name="image" accept="image/*"></label>
  <button type="submit">Submit</button>
</form>
{% endblock %}
